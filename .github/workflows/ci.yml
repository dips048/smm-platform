name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  # nx-set-shas reads previous workflow runs to find the last green commit.
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NX_NO_CLOUD: true
  # Postgres service below, for integration tests that need a real database.
  DATABASE_URL: postgres://smm:smm@localhost:5432/smm

jobs:
  ci:
    # This job name is the status check to require on main (branch protection).
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        # Same major as DigitalOcean Managed PostgreSQL and docker-compose.yml.
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: smm
          POSTGRES_PASSWORD: smm
          POSTGRES_DB: smm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smm -d smm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so nx affected can diff against the base commit.
          fetch-depth: 0
          filter: tree:0

      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Sets NX_BASE / NX_HEAD: the PR's target branch, or the last green
      # commit on the pushed branch.
      - uses: nrwl/nx-set-shas@v5
        with:
          main-branch-name: ${{ github.base_ref || github.ref_name }}

      - run: pnpm nx format:check --base="$NX_BASE" --head="$NX_HEAD"

      - run: pnpm nx affected -t lint typecheck test build --parallel=3
